version: "3.7"

services:
  codam-web-greeter-server:
    container_name: codam-web-greeter-server
    restart: unless-stopped
    build:
      context: .
      dockerfile: dockerfile
    volumes:
      - ./.env:/app/.env
      - ./messages.json:/app/messages.json
    env_file:
      - .env
    # exposes port 3000 on the container from the dockerfile
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    container_name: codam-web-greeter-proxy
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./configs/certs:/etc/nginx/certs
    depends_on:
      - codam-web-greeter-server
